<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Sales Field Management - Hệ thống quản lý hoạt động thực tế của nhân viên Sales đi thị trường tối ưu dưới 10 người." />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KingPetro Sale" />
  <title>Sales Field Management - Hệ Thống Quản Lý Sales Thị Trường</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json?v=20261127b" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=20261127f" />
</head>
<body>

  <!-- Full-Screen Authentication Wall (Login Screen) -->
  <div id="auth-wall-container" style="display: none;"></div>

  <!-- Top Demo Switcher Bar -->
  <div id="role-switcher-container"></div>

  <!-- Mobile Sidebar Backdrop -->
  <div id="mobile-nav-backdrop" class="mobile-nav-backdrop" onclick="App.closeMobileNav()"></div>

  <!-- Main Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="header-left-group">
        <button id="btn-nav-toggle" type="button" class="btn-nav-toggle" onclick="App.toggleSidebarNav()" aria-label="Bật hoặc tắt thanh điều hướng" title="Bật / Tắt menu điều hướng">
          <svg class="lucide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <div class="brand-logo">
          <div class="brand-badge">
            <svg class="lucide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="brand-text-wrap">
            <h1 class="brand-title">SALES FIELD</h1>
            <div class="brand-subtitle">FIELD MANAGEMENT SYSTEM</div>
          </div>
        </div>
      </div>

      <div class="user-profile-badge" id="header-user-profile">
        <div class="header-user-meta">
          <strong id="current-user-name" class="header-user-name">Nguyễn Văn A</strong>
          <span id="current-user-team" class="header-user-sub">North Team</span>
        </div>
        <span id="current-user-role-badge" class="role-pill role-sales">SALES</span>
        <button id="btn-header-login-switch" class="btn-action-inline header-action-btn" onclick="App.showUserSwitcherModal()" title="Đổi vai trò kiểm thử">
          <span id="header-login-btn-icon"></span> <span class="hdr-btn-label">Đổi vai trò</span>
        </button>
        <button id="btn-header-change-pass" class="btn-action-inline header-action-btn" onclick="App.showChangePasswordModal()" title="Đổi mật khẩu tài khoản">
          🔑 <span class="hdr-btn-label">Đổi mật khẩu</span>
        </button>
        <button id="btn-header-logout" class="btn-action-inline header-action-btn header-logout-btn" onclick="App.logout()" title="Đăng xuất khỏi hệ thống">
          🚪 <span class="hdr-btn-label">Thoát</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Content Workspaces -->
  <main class="main-wrapper">
    <!-- Sales Mobile Workspace -->
    <section id="sales-view-container" style="display: none;"></section>

    <!-- Manager Desktop Workspace -->
    <section id="manager-view-container" style="display: none;"></section>
  </main>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Application Scripts -->
  <script src="js/icons.js?v=20261127f"></script>
  <script src="js/geo.js?v=20261127f"></script>
  <script src="js/products.js?v=20261127f"></script>
  <script src="js/permissions.js?v=20261127f"></script>
  <script src="js/api.js?v=20261127f"></script>
  <script src="js/sales_app.js?v=20261127f"></script>
  <script src="js/manager_app.js?v=20261127f"></script>
  <script src="js/app.js?v=20261127f"></script>
</body>
</html>
